[project]
name = "xuemian-ai-backend"
version = "0.1.0"
description = "学面通AI FastAPI 后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "boto3>=1.43.80",
    "cryptography>=50.0.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jieba==0.42.1",
    "langchain>=1.3.15",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.2.11",
    "langsmith>=0.11.1",
    "llama-index-core==0.14.12",
    "markdown-it-py==4.0.0",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pypdf>=6.16.2",
    "pypdfium2==4.30.0",
    "python-docx==1.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client==1.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
xuemian-ai-practice-worker = "xuemian_ai.practice.worker:run"
xuemian-ai-document-worker = "xuemian_ai.document_processing.worker:run"
xuemian-ai-init-vectors = "xuemian_ai.document_processing.cli:run"
xuemian-ai-api = "xuemian_ai.main:run"
xuemian-ai-init-admin = "xuemian_ai.auth.admin_cli:run"
xuemian-ai-init-storage = "xuemian_ai.file_management.storage_cli:run"
xuemian-ai-file-worker = "xuemian_ai.file_management.worker:run_worker"
xuemian-ai-file-scheduler = "xuemian_ai.file_management.worker:run_scheduler"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xuemian_ai"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["xuemian_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
