name: xuemian-ai

services:
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3@sha256:800cf3f352a0a27e3275ca854a51f0027975d7acc7a0d52089a35bcc9fcbf0b5
    command: /data
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.15.1@sha256:d122138f76868edba68d36cb0833139c1d1761f00f09e48e61f8314196e6a4c6
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  document-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "xuemian-ai-document-worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@host.docker.internal:5432/${APP_DB_NAME}
      REDIS_URL: redis://host.docker.internal:6379/0
      RUSTFS_INTERNAL_ENDPOINT: http://rustfs:9000
      QDRANT_URL: http://qdrant:6333
      ENVIRONMENT: development
      LOG_FORMAT: json
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      rustfs:
        condition: service_healthy
      qdrant:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@host.docker.internal:5432/${APP_DB_NAME}
      REDIS_URL: redis://host.docker.internal:6379/0
      RUSTFS_HEALTH_URL: http://rustfs:9000/health
      RUSTFS_INTERNAL_ENDPOINT: http://rustfs:9000
      RUSTFS_PUBLIC_ENDPOINT: http://localhost:9000
      ENVIRONMENT: development
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      QDRANT_URL: http://qdrant:6333
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8000:8000"
    depends_on:
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  file-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "xuemian-ai-file-worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@host.docker.internal:5432/${APP_DB_NAME}
      REDIS_URL: redis://host.docker.internal:6379/0
      RUSTFS_HEALTH_URL: http://rustfs:9000/health
      RUSTFS_INTERNAL_ENDPOINT: http://rustfs:9000
      RUSTFS_PUBLIC_ENDPOINT: http://localhost:9000
      ENVIRONMENT: development
      LOG_FORMAT: json
      LOG_LEVEL: INFO
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      rustfs:
        condition: service_healthy

  file-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "xuemian-ai-file-scheduler"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@host.docker.internal:5432/${APP_DB_NAME}
      REDIS_URL: redis://host.docker.internal:6379/0
      RUSTFS_HEALTH_URL: http://rustfs:9000/health
      RUSTFS_INTERNAL_ENDPOINT: http://rustfs:9000
      RUSTFS_PUBLIC_ENDPOINT: http://localhost:9000
      ENVIRONMENT: development
      LOG_FORMAT: json
      LOG_LEVEL: INFO
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      rustfs:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  rustfs-data:
  qdrant-data:
